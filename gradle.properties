# ============================================================
#  Blade Wraith — Gradle Properties
#  Global JVM, Android, and Kotlin configuration.
#  This file controls how Gradle and AGP behave during build.
# ============================================================

# ============================================================
#  JVM Arguments
#  Memory and performance tuning for the Gradle daemon.
# ============================================================
# Heap size: 2 GB is safe for small projects; increase for larger.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use parallel execution for multi-module builds
org.gradle.parallel=true

# Enable configuration cache (Gradle 8+)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enable build cache
org.gradle.caching=true

# Daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# ============================================================
#  AndroidX
#  Required for modern Android projects.
# ============================================================
android.useAndroidX=true

# Non-transitive R classes — reduces method count, faster builds.
android.nonTransitiveRClass=true

# Non-final resource IDs — required by some libraries.
android.nonFinalResIds=false

# Enable R8 full mode (aggressive optimizations)
android.enableR8.fullMode=true

# ============================================================
#  Kotlin
#  Language and compiler settings.
# ============================================================
# Official code style
kotlin.code.style=official

# Enable incremental compilation
kotlin.incremental=true

# Suppress Kotlin daemon fallback warning
kotlin.daemon.jvmargs=-Xmx1024m

# ============================================================
#  Android Gradle Plugin (AGP) Settings
#  Behavior that affects the whole Android build.
# ============================================================
# Suppress warning about deprecated features (cleaner logs)
android.suppressUnsupportedCompileSdk=34

# Enable Jetifier only if a legacy library requires it (disabled for speed)
android.enableJetifier=false

# Disable PNG crunching (we use procedural textures, no PNGs)
android.enablePngCrunching=false

# ============================================================
#  Build Output
#  Keep outputs organized and avoid stale artifacts.
# ============================================================
# Skip Gradle's own build info generation (not needed)
org.gradle.buildIdentifier=none

# ============================================================
#  IDE / Developer Settings
#  Helpful for local development; ignored on CI.
# ============================================================
# Show full stack traces on failure
org.gradle.logging.stacktrace=all

# Set Gradle's log level (quiet, lifecycle, info, debug)
org.gradle.logging.level=lifecycle

# ============================================================
#  Experimental Features
#  Use with caution — may change between Gradle versions.
# ============================================================
# Faster compile avoidance for Kotlin
kotlin.incremental.useClasspathSnapshot=true

# ============================================================
#  Security & Signing
#  Keys for release signing are NOT stored here.
#  Use environment variables or a local keystore.properties.
# ============================================================
# (No signing keys in this file — see app/build.gradle.kts)

# ============================================================
#  CI/CD Detection
#  GitHub Actions sets CI=true automatically.
#  These overrides make CI builds more reliable.
# ============================================================
# (Handled by GitHub Actions environment — no changes needed here)
